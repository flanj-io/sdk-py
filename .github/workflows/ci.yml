name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the current release. The floor is not decoration:
        # `requires-python` promises it, so it has to be exercised.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv venv --python ${{ matrix.python }} && uv pip install -e ".[dev]"
      - name: Test (mcp 2.x)
        run: uv run --no-project pytest -q
      # Same job, second pass - so no required check is renamed. Most Python agents
      # still run the 1.x line, and it differs exactly where capture depends on it:
      # it keeps no serverInfo after the handshake and has no dispatcher to observe
      # the client's JSON-RPC ids on.
      - name: Test (mcp 1.x)
        run: uv pip install "mcp<2" && uv run --no-project pytest -q
      # Third pass: the declared OpenTelemetry floor. The two passes above resolve
      # the NEWEST opentelemetry release (the pins are `>=1.24` with no lockfile),
      # which is what a fresh `pip install flanj` gets and where a renamed enum or
      # class first shows up. This pass is the other end of that range, so a change
      # that only works on a recent release cannot ship under a `>=1.24` promise.
      - name: Test (opentelemetry floor 1.24)
        run: >-
          uv pip install "opentelemetry-api==1.24" "opentelemetry-sdk==1.24"
          "opentelemetry-exporter-otlp-proto-http==1.24"
          && uv run --no-project pytest -q
      - name: Lint
        run: uv run --no-project ruff check .
      - name: Types
        run: uv run --no-project mypy

  smoke:
    name: stranger smoke (built artefact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Builds the wheel, installs THAT into a fresh venv with nothing of this repo on
      # the path, and drives a real MCP server over stdio. The test job above cannot
      # see a module left out of the wheel or a dependency declared only in `dev`.
      - run: bash scripts/smoke-pack.sh

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          # --no-merges: a merge commit is created by GitHub, carries no author
          # sign-off, and failing on it blocks every PR that has merged main back in.
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%B' "$sha" | grep -qi "^Signed-off-by: "; then
              echo "::error::commit $sha by $author has no Signed-off-by line"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base".."$head")
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with: git commit -s  (or: git rebase --signoff $base)"
            exit 1
          fi
          echo "all commits signed off"
